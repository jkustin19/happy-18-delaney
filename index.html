<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Delaney Turns 18</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,500&family=Caveat:wght@600&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one centered stage; three scenes (sealed envelope, letter, gift card) swap in place. Single warm-paper look by choice. */
:root{
  --paper:#efe9df; --card:#fbf8f2; --ink:#4a2e1c; --brown:#7a4a2b; --caramel:#b5713f; --line:#d9c7b2; --seal:#8c3b2a;
  --display:'Playfair Display',Georgia,serif; --hand:'Caveat','Bradley Hand',cursive; --ui:Inter,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:center;min-height:100%;overflow-x:hidden}
.stage{width:100%;max-width:460px;padding-block:28px;display:flex;flex-direction:column;align-items:center;gap:22px}
.scene[hidden]{display:none!important}
.scene{width:100%;display:flex;flex-direction:column;align-items:center;gap:20px;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;letter-spacing:.32em;font-weight:700;color:var(--caramel);text-transform:uppercase}

/* Envelope */
.env-wrap{width:100%;aspect-ratio:1.45;max-width:100%;position:relative;cursor:pointer;border:0;background:none;padding:0;perspective:900px}
.env-wrap:focus-visible{outline:3px solid var(--caramel);outline-offset:8px;border-radius:12px}
.env{position:absolute;inset:0;background:#e3d3bd;border-radius:10px;box-shadow:0 22px 40px rgba(74,46,28,.22);overflow:hidden}
.env::before{content:"";position:absolute;inset:0;background:
  linear-gradient(32deg,transparent 49.5%,#d7c3a8 50%) left bottom/50% 100% no-repeat,
  linear-gradient(-32deg,transparent 49.5%,#d7c3a8 50%) right bottom/50% 100% no-repeat}
.flap{position:absolute;left:0;right:0;top:0;height:62%;transform-origin:top;transition:transform .8s cubic-bezier(.6,.05,.3,1);z-index:2}
.flap::before{content:"";position:absolute;inset:0;background:#cfb896;clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 3px 2px rgba(74,46,28,.15))}
.seal{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#b0523d,var(--seal) 60%,#6b2a1d);z-index:3;display:grid;place-items:center;
  color:#f3dccb;font-family:var(--display);font-style:italic;font-size:34px;box-shadow:0 4px 8px rgba(0,0,0,.25);transition:opacity .4s}
.to{position:absolute;bottom:14%;width:100%;text-align:center;font-family:var(--hand);font-size:34px;color:var(--brown);z-index:1}
.opened .flap{transform:rotateX(180deg)}
.opened .seal{opacity:0}
.hint{font-size:14px;color:var(--brown);display:flex;gap:8px;align-items:center}
.hint .dot{width:8px;height:8px;border-radius:50%;background:var(--caramel);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.4}}

/* Letter */
.letter{width:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:34px 28px 30px;
  box-shadow:0 18px 36px rgba(74,46,28,.16);position:relative;
  }
.letter h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,11vw,52px);line-height:1.02;text-wrap:balance;margin:0 0 14px}
.letter h1 em{font-weight:500;color:var(--caramel)}
.letter p{font-family:var(--hand);font-size:clamp(25px,6.6vw,29px);line-height:40px;margin:0;color:var(--ink)}
.letter .sign{margin-top:18px;text-align:right;color:var(--brown)}
.btn{font-family:var(--ui);font-weight:700;font-size:15px;letter-spacing:.06em;border:0;border-radius:999px;padding:15px 26px;
  background:var(--ink);color:var(--paper);cursor:pointer;box-shadow:0 8px 18px rgba(74,46,28,.25)}
.btn:focus-visible{outline:3px solid var(--caramel);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--brown);box-shadow:none;text-decoration:underline;text-underline-offset:4px;font-weight:500;letter-spacing:0}

/* Gift */
.gift img{width:100%;max-width:100%;border-radius:14px;box-shadow:0 22px 44px rgba(74,46,28,.25);display:block}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
<main class="stage">

  <section class="scene" id="s1">
    <div class="eyebrow">For Delaney</div>
    <button class="env-wrap" id="envelope" aria-label="Open your birthday envelope">
      <div class="env"></div>
      <div class="flap"></div>
      <div class="seal">D</div>
      <div class="to">Delaney</div>
    </button>
    <div class="hint"><span class="dot"></span>Tap the envelope to open it</div>
  </section>

  <section class="scene" id="s2" hidden>
    <article class="letter">
      <h1>Happy 18th, <em>Delaney</em></h1>
      <p>You're officially an adult! We're so proud of you, and we can't wait to celebrate with you.</p>
      <p>For your birthday, here's what we're getting you&hellip;</p>
      <p class="sign">love, Jackson &amp; Katie</p>
    </article>
    <button class="btn" id="reveal">See your gift</button>
  </section>

<script>
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function show(id){['s1','s2','s3'].forEach(s=>$(s).hidden=(s!==id));window.scrollTo(0,0)}
$('envelope').addEventListener('click',()=>{
  $('envelope').classList.add('opened');
  setTimeout(()=>show('s2'),reduce?0:900);
});
$('reveal').addEventListener('click',()=>{show('s3');if(!reduce)burst()});
$('again').addEventListener('click',()=>show('s2'));

function burst(){
  const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#b5713f','#7a4a2b','#e3c9a4','#8c3b2a','#d9b38c'];
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:Math.random()*-13-3,
    s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++t<150)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
